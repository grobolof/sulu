server {
    listen 80;
    server_name ${APP_HOST};
    index index.php;
    root ${APP_PATH}/public;

    # Лимиты (Sulu: загрузка медиа)
    client_max_body_size 512M;
    client_body_timeout 60s;

    # Логи (рекомендуется)
    access_log /var/log/nginx/${APP_HOST}_access.log;
    error_log /var/log/nginx/${APP_HOST}_error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~* \.(?:ico|css|js|gif|webp|avif|jpe?g|png|svg|woff|woff2|eot|ttf|mp4)$ {
        try_files $uri /index.php$is_args$args;
        access_log off;
        expires 1y;
        add_header Pragma public;
        add_header Cache-Control "public, immutable";
    }

    # index.php — сайт и /admin; config.php — Symfony Runtime
    location ~ ^/(index|config)\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }
}
